<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded Card Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Outer Glow Pulse Ring -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Activity Pulse Waveform -->
  <path d="M 20 64 L 38 64 L 48 38 L 60 88 L 74 24 L 88 74 L 98 64 L 108 64" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Pulse Status Dot -->
  <circle cx="98" cy="64" r="5" fill="#34d399"/>
</svg>
